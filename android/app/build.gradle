plugins {
    id 'com.android.application'
    id 'com.google.firebase.crashlytics'
}

def devApiBaseUrl = System.getenv("TEXTBEE_DEV_API_BASE_URL") ?: ""
def productionApiBaseUrl = "https://textbee.bobpappas.com/api/v1/"
def dashboardUrlForApiBaseUrl = { String value ->
    value.endsWith("/api/v1/")
            ? value.substring(0, value.length() - "/api/v1/".length()) + "/dashboard"
            : ""
}

def validateApiBaseUrl = { String value, String source ->
    if (!value) {
        throw new GradleException("${source} is required and must end in /api/v1/")
    }

    java.net.URI uri
    try {
        uri = new java.net.URI(value)
    } catch (Exception ignored) {
        throw new GradleException("${source} must be a valid HTTP(S) URL ending in /api/v1/")
    }

    if (!(uri.scheme in ["http", "https"]) ||
            !uri.host ||
            uri.userInfo ||
            uri.query ||
            uri.fragment ||
            !uri.path.endsWith("/api/v1/")) {
        throw new GradleException("${source} must be an HTTP(S) URL ending in /api/v1/")
    }
}

def quoteBuildConfigString = { String value ->
    "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

def releaseStoreFile = System.getenv("TEXTBEE_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("TEXTBEE_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("TEXTBEE_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("TEXTBEE_RELEASE_KEY_PASSWORD")
def releaseSigningValues = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
]
def releaseSigningConfigured = releaseSigningValues.every { it }

android {
    compileSdk 32

    defaultConfig {
        minSdk 24
        targetSdk 32
        versionCode 17
        versionName "2.7.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        javaCompileOptions {
//            annotationProcessorOptions {
//                arguments["room.schemaLocation"] = "$projectDir/schemas"
//            }
//        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            textbeeRelease {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigningConfigured ? signingConfigs.textbeeRelease : null
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    flavorDimensions "environment"
    
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.bobpappas.textbee.dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "API_BASE_URL", quoteBuildConfigString(devApiBaseUrl)
            buildConfigField "String", "DASHBOARD_URL",
                    quoteBuildConfigString(dashboardUrlForApiBaseUrl(devApiBaseUrl))
            buildConfigField "String", "ENVIRONMENT", '"development"'
            resValue "string", "app_name", "TextBee (Dev)"
        }
        
        prod {
            dimension "environment"
            applicationId "com.bobpappas.textbee"
            buildConfigField "String", "API_BASE_URL", quoteBuildConfigString(productionApiBaseUrl)
            buildConfigField "String", "DASHBOARD_URL",
                    quoteBuildConfigString(dashboardUrlForApiBaseUrl(productionApiBaseUrl))
            buildConfigField "String", "ENVIRONMENT", '"production"'
            resValue "string", "app_name", "TextBee"
        }
    }

    variantFilter { variant ->
        if (variant.flavors*.name.contains("dev") && variant.buildType.name == "release") {
            setIgnore(true)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def verifyDevApiBaseUrl = tasks.register("verifyDevApiBaseUrl") {
    group = "verification"
    description = "Validates the required self-hosted development API base URL."
    doLast {
        validateApiBaseUrl(devApiBaseUrl, "TEXTBEE_DEV_API_BASE_URL")
    }
}

def verifyProductionReleaseSigning = tasks.register("verifyProductionReleaseSigning") {
    group = "verification"
    description = "Refuses production release builds without external release signing inputs."
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                    "Production release signing requires TEXTBEE_RELEASE_STORE_FILE, " +
                            "TEXTBEE_RELEASE_STORE_PASSWORD, TEXTBEE_RELEASE_KEY_ALIAS, and " +
                            "TEXTBEE_RELEASE_KEY_PASSWORD"
            )
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException("TEXTBEE_RELEASE_STORE_FILE must name an existing keystore")
        }
    }
}

android.applicationVariants.all { variant ->
    if (variant.flavorName == "dev") {
        variant.preBuildProvider.configure {
            dependsOn verifyDevApiBaseUrl
        }
    }
    if (variant.name == "prodRelease") {
        variant.preBuildProvider.configure {
            dependsOn verifyProductionReleaseSigning
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation platform('com.google.firebase:firebase-bom:29.2.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-messaging-directboot'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.1.0'
    
    implementation 'androidx.work:work-runtime:2.7.1'

//    def room_version = "2.4.2"
//    implementation "androidx.room:room-runtime:$room_version"
//    annotationProcessor "androidx.room:room-compiler:$room_version"
}

apply plugin: 'com.google.gms.google-services'
